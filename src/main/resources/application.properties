spring.application.name=boss-semester
server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/boss_semester}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false

gigachat.oauth-url=${GIGACHAT_OAUTH_URL:https://ngw.devices.sberbank.ru:9443/api/v2/oauth}
gigachat.api-base-url=${GIGACHAT_API_BASE_URL:https://gigachat.devices.sberbank.ru/api/v1}
gigachat.model=${GIGACHAT_MODEL:GigaChat}
gigachat.demo-mode=${GIGACHAT_DEMO_MODE:false}
gigachat.auth-key=${GIGACHAT_AUTH_KEY:}
gigachat.scope=${GIGACHAT_SCOPE:GIGACHAT_API_PERS}

app.images-dir=${APP_IMAGES_DIR:generated-images}
app.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:8080}
app.default-daily-limit=${APP_DAILY_LIMIT:5}

springdoc.swagger-ui.path=/swagger-ui.html